<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Photo Test App (GitHub Live)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: #f1f5f9; 
      margin: 0; 
      padding: 20px; 
      display: flex; 
      gap: 20px; 
      justify-content: center; 
      align-items: flex-start; 
      min-height: 100vh; 
    }
    
    .app-container { background: white; padding: 24px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; flex: 1; }
    
    .mock-sidebar {
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 300px;
      text-align: center;
    }
    
    .mock-sidebar img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #800000;
      margin-bottom: 15px;
      background-color: #e2e8f0; 
      display: none; /* Hidden by default until a batch is picked */
    }

    .form-group { margin-bottom: 18px; text-align: left; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #475569; }
    select { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #e2e8f0; font-size: 16px; }
  </style>
</head>
<body>

  <div class="mock-sidebar">
    <img id="facultyPhoto" src="" alt="Faculty Photo">
    
    <h3 style="margin: 0 0 15px 0;">ADC Faculty</h3>
    
    <div class="form-group">
      <label>Select Your Batch</label>
      <select id="batchSelect" onchange="updateFacultyPhoto()">
        <option value="DEFAULT">-- Choose Batch --</option>
        <option value="BTYM_JUNIORS">BTYM Juniors</option>
        <option value="KTK_SENIORS">KTK Seniors</option>
        <option value="KIDS_BATCH">Kids Beginners</option>
      </select>
    </div>
  </div>

  <div class="app-container">
    <h2 style="margin-top:0;">Ledger & Data App</h2>
    <p>Select a batch on the left to test the live GitHub photo loading.</p>
  </div>

  <script>
    // ==========================================
    // THE DICTIONARY TRICK (Using GitHub Files)
    // ==========================================
    
    // Make sure these match the EXACT file names of the photos you uploaded to GitHub!
    // If you named it "Mam.JPG", you must type "./Mam.JPG" here. It is case-sensitive!
    const FACULTY_PHOTOS = {
      "DEFAULT": "", 
      "BTYM_JUNIORS": "./mam.jpg", 
      "KTK_SENIORS": "./anand.jpg", 
      "KIDS_BATCH": "./ananya.jpg"     
    };

    function updateFacultyPhoto() {
      const selectedBatch = document.getElementById('batchSelect').value;
      const newPhotoUrl = FACULTY_PHOTOS[selectedBatch] || FACULTY_PHOTOS["DEFAULT"];
      
      const imgElement = document.getElementById('facultyPhoto');
      
      if (newPhotoUrl === "") {
          imgElement.style.display = "none";
      } else {
          imgElement.style.display = "inline-block";
          imgElement.src = newPhotoUrl;
      }
    }
  </script>
</body>
</html>
